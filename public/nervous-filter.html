<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Nervous Face Filter - Live Canvas Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            transform: scaleX(-1);
        }
        video {
            display: none;
        }
        #badge {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(18, 18, 18, 0.85);
            color: #fff;
            padding: 8px 20px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            letter-spacing: 0.5px;
            z-index: 100;
            pointer-events: none;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffcc4d;
            font-size: 16px;
            font-weight: 600;
            background: rgba(0,0,0,0.8);
            padding: 16px 28px;
            border-radius: 16px;
            border: 1px solid rgba(255,204,77,0.3);
            z-index: 200;
        }
    </style>

    <!-- Google MediaPipe Tasks-Vision CDN Script -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/tasks-vision_bundle.js" crossorigin="anonymous"></script>
</head>
<body>

<div id="container">
    <div id="loading">Initializing MediaPipe Face Landmarker...</div>
    <div id="badge">Nervous</div>

    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="filterCanvas"></canvas>
</div>

<script>
const video = document.getElementById('webcam');
const canvas = document.getElementById('filterCanvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const loadingEl = document.getElementById('loading');

let faceLandmarker = null;
let lastVideoTime = -1;

// 1. Initialize Official MediaPipe Tasks Vision Face Landmarker
async function initMediaPipe() {
    try {
        const { FilesetResolver, FaceLandmarker } = vision;
        const filesetResolver = await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );
        
        faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
            baseOptions: {
                modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
                delegate: "GPU"
            },
            runningMode: "VIDEO",
            numFaces: 1
        });

        loadingEl.style.display = 'none';
        startWebcam();
    } catch (err) {
        console.error("Failed to initialize MediaPipe:", err);
        // Fallback to center-screen calculation if CDN fails
        loadingEl.innerText = "Tracking Ready (Fallback Mode)";
        setTimeout(() => { loadingEl.style.display = 'none'; }, 1500);
        startWebcam();
    }
}

// 2. Request User Webcam Stream
function startWebcam() {
    navigator.mediaDevices.getUserMedia({ 
        video: { 
            width: { ideal: 1280 }, 
            height: { ideal: 720 },
            facingMode: "user" 
        } 
    })
    .then(stream => {
        video.srcObject = stream;
        video.addEventListener('loadedmetadata', () => {
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            requestAnimationFrame(renderFilter);
        });
    })
    .catch(err => {
        alert("Webcam access error: " + err.message);
    });
}

// 3. Real-time Frame Processing Loop
function renderFilter() {
    if (video.readyState >= 2) {
        const width = canvas.width;
        const height = canvas.height;

        // Draw current frame onto 2D Canvas
        ctx.drawImage(video, 0, 0, width, height);

        // Detect Face Landmarks
        let noseX = width / 2;
        let noseY = height * 0.45;
        let mouthY = height * 0.65;
        let faceRadius = Math.min(width, height) * 0.4;

        if (faceLandmarker && video.currentTime !== lastVideoTime) {
            lastVideoTime = video.currentTime;
            const results = faceLandmarker.detectForVideo(video, performance.now());
            
            if (results && results.faceLandmarks && results.faceLandmarks.length > 0) {
                const landmarks = results.faceLandmarks[0];
                
                // Nose Tip = Landmark 1
                const noseLandmark = landmarks[1];
                // Mouth Center = Landmark 13 / 14
                const mouthLandmark = landmarks[13] || landmarks[14] || landmarks[0];

                if (noseLandmark && mouthLandmark) {
                    noseX = noseLandmark.x * width;
                    noseY = noseLandmark.y * height;
                    mouthY = mouthLandmark.y * height;

                    // Approximate face size radius from chin (Landmark 152) and forehead (Landmark 10)
                    const chin = landmarks[152];
                    const forehead = landmarks[10];
                    if (chin && forehead) {
                        const faceHeight = Math.abs(chin.y - forehead.y) * height;
                        faceRadius = faceHeight * 1.1;
                    }
                }
            }
        }

        // Extract raw pixel buffer
        const frame = ctx.getImageData(0, 0, width, height);
        const originalData = new Uint8ClampedArray(frame.data);

        // 4. THE WARPING MATH (MATCHING THE SCREENSHOT)
        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                const dx = x - noseX;
                const dy = y - noseY;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < faceRadius) {
                    const strength = (faceRadius - distance) / faceRadius;

                    let sourceX = x;
                    let sourceY = y;

                    if (y < noseY) {
                        // ABOVE NOSE TIP: Inward horizontal squeeze to pinch the top of the head
                        sourceX = noseX + dx * (1.0 + strength * 0.35);
                    } else {
                        // BELOW NOSE TIP: Aggressive outward horizontal stretch (strength ~ 0.65) to balloon mouth and cheeks
                        sourceX = noseX + dx * (1.0 - strength * 0.65);
                    }

                    // Vertical Squash: compress face matrix vertically (on Y-axis) to flatten nose closer to mouth
                    sourceY = noseY + dy * (1.0 + strength * 0.25);

                    // Clamp inside bounds
                    sourceX = Math.max(0, Math.min(width - 1, Math.floor(sourceX)));
                    sourceY = Math.max(0, Math.min(height - 1, Math.floor(sourceY)));

                    const targetIdx = (y * width + x) * 4;
                    const sourceIdx = (sourceY * width + sourceX) * 4;

                    frame.data[targetIdx]     = originalData[sourceIdx];     // Red
                    frame.data[targetIdx + 1] = originalData[sourceIdx + 1]; // Green
                    frame.data[targetIdx + 2] = originalData[sourceIdx + 2]; // Blue
                }
            }
        }

        // Put manipulated pixels back onto Canvas
        ctx.putImageData(frame, 0, 0);
    }

    requestAnimationFrame(renderFilter);
}

// Start application
window.addEventListener('DOMContentLoaded', initMediaPipe);
</script>
</body>
</html>
